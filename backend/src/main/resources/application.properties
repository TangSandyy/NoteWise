spring.application.name=NoteWise

# Lokale Umgebungsvariablen (z. B. OPENAI_API_KEY) aus backend/.env laden, die Datei wird nicht gepusht
spring.config.import=optional:file:.env[.properties]

# --- Datenbank (PostgreSQL, startet automatisch ueber compose.yaml) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/notewise
spring.datasource.username=notewise
spring.datasource.password=notewise

# Container beim Beenden der App laufen lassen, damit der naechste Start schneller geht
spring.docker.compose.lifecycle-management=start-only

# --- JPA / Hibernate ---
# Tabellen werden aus den Entities erzeugt bzw. angepasst
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- KI (OpenAI) ---
# Ohne Key startet die App trotzdem, KI-Aufrufe schlagen dann aber fehl
spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}
